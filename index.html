<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ユタカ駐車場">
  <title>駐車場・賃貸物件マップ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #filterToggle {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: rgba(255,255,255,0.96);
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    #filterBox {
      position: absolute;
      top: 52px;
      left: 10px;
      z-index: 9999;
    }

    .hidden {
      display: none;
    }

    #searchBox {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(255,255,255,0.96);
      padding: 8px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #searchBox input {
      width: 220px;
      padding: 7px 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    #searchBox button {
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: #0078d7;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    #searchBox button.resetBtn {
      background: #666;
    }

    #editModeBtn {
      background: #f59e0b !important;
    }

    #editModeBtn.on {
      background: #dc2626 !important;
    }

    #saveStatus {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      background: rgba(17, 24, 39, 0.92);
      color: white;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: none;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .popup-title {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .popup-row {
      margin-bottom: 4px;
      line-height: 1.5;
      font-size: 13px;
    }

    .popup-coord {
      background: #f3f4f6;
      padding: 5px 6px;
      border-radius: 6px;
      margin: 6px 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .popup-note {
      color: #dc2626;
      font-weight: 700;
      font-size: 12px;
      margin-top: 5px;
    }

    .popup-buttons {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .popup-link {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .popup-link:hover,
    .popup-link:visited,
    .popup-link:active {
      color: #ffffff !important;
      text-decoration: none !important;
    }

    .map-legend {
      background: rgba(255,255,255,0.96);
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      min-width: 180px;
      line-height: 1.6;
      font-size: 13px;
    }

    .map-legend-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 12px;
    }

    .filter-check {
      margin-right: 6px;
    }

    @media (max-width: 768px) {
      #filterToggle {
        top: 10px;
        left: 10px;
        font-size: 13px;
        padding: 6px 8px;
      }

      #filterBox {
        top: 50px;
        left: 10px;
      }

      #searchBox {
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;
        top: auto;
        z-index: 10000;
        flex-wrap: wrap;
        max-width: none;
      }

      #searchBox input {
        width: 100%;
        box-sizing: border-box;
      }

      #searchBox button {
        flex: 1;
        min-width: 70px;
      }

      #saveStatus {
        bottom: 78px;
      }
    }
  </style>
</head>

<body>
  <div id="filterToggle">☰ フィルター</div>
  <div id="filterBox"></div>

  <div id="searchBox">
    <input type="text" id="keyword" placeholder="物件名・住所で検索">
    <button onclick="searchLocation()">検索</button>
    <button class="resetBtn" onclick="resetMap()">解除</button>
    <button id="editModeBtn" onclick="toggleEditMode()">位置調整OFF</button>
  </div>

  <div id="saveStatus"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // ===== 設定 =====
    const SPREADSHEET_ID = "1pJ83qHK4bOB9Ieu6hE6PaKTSoEgDrQ_NF_gnwh6tGcI";

    const baseCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ76snEoxeYompsWzXbGi-bdBG6Q5ZLT7lQjq1uMscKSbdCK_PZ8MYz8mUy3U1zrKANbdAwNWqAcSTf/pub?gid=1483465781&single=true&output=csv";
    const csvUrl = baseCsvUrl + "&t=" + Date.now();

    // ★ここにApps Scriptの /exec URL を入れる
    const POSITION_UPDATE_URL = "https://script.google.com/macros/s/AKfycbzMkdoIBW_LOsT_hLfg21cQH_7DQ34SWaf8ka2e7aOSGLnNj77eZMUvAskYzGqYuZ-2AQ/exec";

    // Apps Script側の TOKEN と同じ文字
    const POSITION_UPDATE_TOKEN = "yutaka-map-2026";

    // ===== 地図 =====
    const map = L.map("map").setView([34.9897, 137.0021], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ===== 変数 =====
    const markers = [];
    const allData = [];
    const markerIndex = {};
    const markerGroups = {
      parking: [],
      housing: []
    };

    let editMode = false;
    let currentLocationShown = false;
    let currentMarker = null;
    let currentCircle = null;
    let toastTimer = null;

    // ===== メッセージ表示 =====
    function showStatus(message, isError = false) {
      const box = document.getElementById("saveStatus");
      if (!box) return;

      box.textContent = message;
      box.style.display = "block";
      box.style.background = isError
        ? "rgba(220, 38, 38, 0.94)"
        : "rgba(17, 24, 39, 0.92)";

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.style.display = "none";
      }, 3500);
    }

    // ===== 現在地表示 =====
    function showCurrentLocation(center = false) {
      if (!navigator.geolocation) {
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          currentLocationShown = true;

          if (currentMarker) map.removeLayer(currentMarker);
          if (currentCircle) map.removeLayer(currentCircle);

          currentMarker = L.circleMarker([lat, lng], {
            radius: 8,
            color: "#2563eb",
            fillColor: "#3b82f6",
            fillOpacity: 1,
            weight: 2
          }).addTo(map).bindPopup("現在地");

          currentCircle = L.circle([lat, lng], {
            radius: acc,
            color: "#3b82f6",
            fillOpacity: 0.1
          }).addTo(map);

          if (center) {
            map.setView([lat, lng], 17);
          }
        },
        function(err) {
          console.log("現在地取得できません:", err.message);
        },
        {
          enableHighAccuracy: true
        }
      );
    }

    // ===== CSV処理 =====
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    function toObjects(rows) {
      if (!rows || rows.length === 0) return [];

      const headers = rows[0].map(h =>
        String(h || "")
          .replace(/^\uFEFF/, "")
          .replace(/\u200B/g, "")
          .trim()
      );

      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = (r[i] || "").trim();
        });
        return obj;
      });
    }

    // ===== 共通関数 =====
    function num(v) {
      return parseFloat(String(v || "").replace(/,/g, "").trim());
    }

    function isFiniteNumber(v) {
      return typeof v === "number" && isFinite(v);
    }

    function hasValue(v) {
      return String(v || "").trim() !== "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getStatusColor(status) {
      const s = (status || "").trim();

      if (!s) return "#999999";
      if (s === "空予定") return "#f59e0b";
      if (s === "空") return "#007bff";
      if (s === "満") return "#dc2626";

      if (s.includes("予定")) return "#f59e0b";
      if (s.includes("空")) return "#007bff";
      if (s.includes("満")) return "#dc2626";

      return "#999999";
    }

    function getTypeIcon(type) {
      const t = (type || "").trim();
      if (t.includes("駐車場")) return "P";
      if (t.includes("居住") || t.includes("賃貸")) return "⌂";
      return "●";
    }

    function isParking(type) {
      return String(type || "").includes("駐車場");
    }

    function createGoogleMapUrl(lat, lng) {
      return `https://www.google.com/maps?q=${lat},${lng}&t=k`;
    }

    function formatPrice(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (raw.includes("¥") || raw.includes("￥")) return raw;

      const n = parseInt(raw.replace(/,/g, ""), 10);
      if (isNaN(n)) return raw;

      return "¥" + n.toLocaleString();
    }

    function createIcon(color, text, price, type) {
      const parking = isParking(type);
      const showPrice = parking && hasValue(price);
      const displayPrice = formatPrice(price);

      return L.divIcon({
        className: "",
        html: `
          <div style="
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
            transform: translateY(-4px);
            font-family:Arial,sans-serif;
          ">
            <div style="
              width:34px;
              height:34px;
              border-radius:50%;
              background:${color};
              color:white;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:${text === "⌂" ? "16px" : "14px"};
              font-weight:700;
              border:2px solid white;
              box-shadow:0 2px 6px rgba(0,0,0,0.28);
              box-sizing:border-box;
              line-height:1;
            ">${escapeHtml(text)}</div>
            ${showPrice ? `
              <div style="
                margin-top:3px;
                background:rgba(255,255,255,0.98);
                color:#111;
                border-radius:999px;
                padding:2px 8px;
                font-size:12px;
                font-weight:700;
                white-space:nowrap;
                box-shadow:0 1px 4px rgba(0,0,0,0.18);
                border:none;
              ">${escapeHtml(displayPrice)}</div>
            ` : ""}
          </div>
        `,
        iconSize: [showPrice ? 70 : 34, showPrice ? 54 : 34],
        iconAnchor: [showPrice ? 35 : 17, showPrice ? 42 : 17],
        popupAnchor: [0, -18]
      });
    }

    // ===== ポップアップ作成 =====
    function createPopupHtml(data) {
      const lat = Number(data.lat).toFixed(8);
      const lng = Number(data.lng).toFixed(8);

      let html = `<div class="popup-title">${escapeHtml(data.name || "名称未設定")}</div>`;

      if (data.status) html += `<div class="popup-row"><strong>状況：</strong>${escapeHtml(data.status)}</div>`;
      if (data.price) html += `<div class="popup-row"><strong>月額：</strong>${escapeHtml(formatPrice(data.price))}</div>`;
      if (data.shortPrice) html += `<div class="popup-row"><strong>短期：</strong>${escapeHtml(formatPrice(data.shortPrice))}</div>`;
      if (data.address) html += `<div class="popup-row"><strong>住所：</strong>${escapeHtml(data.address)}</div>`;
      if (data.note) html += `<div class="popup-row"><strong>備考：</strong>${escapeHtml(data.note)}</div>`;

      html += `
        <div class="popup-coord">
          <div><strong>緯度：</strong>${lat}</div>
          <div><strong>経度：</strong>${lng}</div>
        </div>
      `;

      if (editMode) {
        html += `<div class="popup-note">位置調整中：ピンをドラッグするとスプレッドシートへ保存されます</div>`;
      }

      html += `<div class="popup-buttons">`;

      if (data.sheetGid) {
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit#gid=${encodeURIComponent(data.sheetGid)}`;
        html += `<a class="popup-link" target="_blank" href="${sheetUrl}" style="background:#16a34a;">シート</a>`;
      }

      html += `<button class="popup-link" type="button" onclick="saveMarkerPosition('${data.markerId}')" style="background:#dc2626;">保存</button>`;
      html += `<button class="popup-link" type="button" onclick="copyMarkerCoords('${data.markerId}')" style="background:#9333ea;">座標コピー</button>`;
      html += `<a class="popup-link" target="_blank" href="${createGoogleMapUrl(lat, lng)}" style="background:#0078d7;">航空</a>`;
      html += `</div>`;

      return html;
    }

    function refreshAllPopups() {
      allData.forEach(data => {
        if (data.marker) {
          data.marker.setPopupContent(createPopupHtml(data));
        }
      });
    }

    // ===== 位置保存：Apps Scriptへ送信 =====
    function saveMarkerPosition(markerId) {
      const data = markerIndex[markerId];
      if (!data || !data.marker) return;

      if (!POSITION_UPDATE_URL) {
        showStatus("Apps ScriptのURLが未設定です", true);
        alert("HTML内の POSITION_UPDATE_URL に Apps Script の /exec URL を入れてください。");
        return;
      }

      const p = data.marker.getLatLng();
      const lat = p.lat.toFixed(8);
      const lng = p.lng.toFixed(8);

      data.lat = Number(lat);
      data.lng = Number(lng);
      data.marker.setPopupContent(createPopupHtml(data));

      const callbackName = "yutakaPositionCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

      const params = new URLSearchParams({
        action: "updatePosition",
        token: POSITION_UPDATE_TOKEN,
        name: data.name,
        type: data.type,
        lat: lat,
        lng: lng,
        callback: callbackName
      });

      const url = POSITION_UPDATE_URL + (POSITION_UPDATE_URL.includes("?") ? "&" : "?") + params.toString();

      showStatus("保存中...");

      let finished = false;
      const script = document.createElement("script");

      function cleanup() {
        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function(res) {
        finished = true;
        cleanup();

        if (res && res.ok) {
          showStatus(`保存しました：${res.sheetName} ${res.row}行目`);
        } else {
          const msg = res && res.error ? res.error : "保存に失敗しました";
          showStatus(msg, true);
          alert(msg);
        }
      };

      script.onerror = function() {
        if (finished) return;
        finished = true;
        cleanup();
        showStatus("保存通信に失敗しました", true);
        alert("保存通信に失敗しました。Apps ScriptのURLやデプロイ設定を確認してください。");
      };

      script.src = url;
      document.body.appendChild(script);

      setTimeout(function() {
        if (finished) return;
        finished = true;
        cleanup();
        showStatus("保存確認が返ってきません", true);
        alert("保存確認が返ってきません。Apps ScriptのデプロイURL、アクセス権限、TOKENを確認してください。");
      }, 15000);
    }

    // ===== 位置調整モード =====
    function toggleEditMode() {
      editMode = !editMode;

      const btn = document.getElementById("editModeBtn");
      if (btn) {
        btn.textContent = editMode ? "位置調整ON" : "位置調整OFF";
        btn.classList.toggle("on", editMode);
      }

      markers.forEach(marker => {
        if (!marker.dragging) return;

        if (editMode) {
          marker.dragging.enable();
        } else {
          marker.dragging.disable();
        }
      });

      refreshAllPopups();

      alert(
        editMode
          ? "位置調整モードです。\n\nピンをドラッグすると、スプレッドシートの I列・J列へ自動保存されます。"
          : "位置調整モードを終了しました。"
      );
    }

    function copyMarkerCoords(markerId) {
      const data = markerIndex[markerId];
      if (!data || !data.marker) return;

      const p = data.marker.getLatLng();
      const lat = p.lat.toFixed(8);
      const lng = p.lng.toFixed(8);
      const text = `${lat}\t${lng}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => {
            alert(`座標をコピーしました。\n\n緯度：${lat}\n経度：${lng}\n\n元シートの I列・J列に貼り付けできます。`);
          })
          .catch(() => {
            alert(`コピーできない場合は手入力してください。\n\n緯度：${lat}\n経度：${lng}`);
          });
      } else {
        alert(`この端末では自動コピーできません。\n手入力してください。\n\n緯度：${lat}\n経度：${lng}`);
      }
    }

    // ===== 表示フィルター =====
    function updateVisibleMarkers() {
      const showParking = document.getElementById("filterParking")?.checked ?? true;
      const showHousing = document.getElementById("filterHousing")?.checked ?? true;

      [...markerGroups.parking, ...markerGroups.housing].forEach(marker => {
        if (map.hasLayer(marker)) {
          map.removeLayer(marker);
        }
      });

      if (showParking) {
        markerGroups.parking.forEach(marker => marker.addTo(map));
      }

      if (showHousing) {
        markerGroups.housing.forEach(marker => marker.addTo(map));
      }
    }

    function renderFilterBox() {
      const box = document.getElementById("filterBox");
      box.innerHTML = `
        <div class="map-legend">
          <div class="map-legend-title">表示フィルター</div>

          <div class="legend-row">
            <label><input type="checkbox" id="filterHousing" class="filter-check" checked>居住用</label>
          </div>
          <div class="legend-row">
            <label><input type="checkbox" id="filterParking" class="filter-check" checked>駐車場</label>
          </div>

          <hr style="border:none;border-top:1px solid #ddd;margin:8px 0;">

          <div class="legend-row"><span class="legend-dot" style="background:#007bff;"></span><span>空</span></div>
          <div class="legend-row"><span class="legend-dot" style="background:#f59e0b;"></span><span>空予定</span></div>
          <div class="legend-row"><span class="legend-dot" style="background:#dc2626;"></span><span>満</span></div>
          <div class="legend-row"><span class="legend-dot" style="background:#999999;"></span><span>不明</span></div>
          <div class="legend-row"><span>⌂ = 居住用 / P = 駐車場</span></div>
        </div>
      `;

      const filterHousing = document.getElementById("filterHousing");
      const filterParking = document.getElementById("filterParking");

      if (filterHousing) filterHousing.addEventListener("change", updateVisibleMarkers);
      if (filterParking) filterParking.addEventListener("change", updateVisibleMarkers);
    }

    // ===== 検索 =====
    function searchLocation() {
      const keyword = document.getElementById("keyword").value.trim().toLowerCase();
      if (!keyword) return;

      const results = allData.filter(d =>
        String(d.name || "").toLowerCase().includes(keyword) ||
        String(d.address || "").toLowerCase().includes(keyword)
      );

      if (results.length === 0) {
        alert("該当データがありません。");
        return;
      }

      if (results.length === 1) {
        const p = results[0].marker.getLatLng();
        map.setView([p.lat, p.lng], 17);
        results[0].marker.openPopup();
      } else {
        const group = L.featureGroup(results.map(r => r.marker));
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }

    function resetMap() {
      document.getElementById("keyword").value = "";

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }

    // ===== 初期化 =====
    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("keyword");
      if (input) {
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            searchLocation();
          }
        });
      }

      renderFilterBox();

      const toggle = document.getElementById("filterToggle");
      const box = document.getElementById("filterBox");

      if (toggle && box) {
        toggle.addEventListener("click", function() {
          box.classList.toggle("hidden");
        });
      }

      showCurrentLocation(false);
    });

    // ===== CSV読み込み =====
    fetch(csvUrl)
      .then(r => r.text())
      .then(text => {
        const data = toObjects(parseCSV(text));

        data.forEach(item => {
          const name = item["名称"] || "";
          const type = item["種別"] || "";
          const status = item["空き状況"] || "";
          const price = item["月額"] || "";
          const shortPrice = item["短期"] || "";
          const address = item["所在地"] || "";
          const note = item["備考"] || "";
          const sheetGid = item["gid"] || "";

          const lat = num(item["緯度"]);
          const lng = num(item["経度"]);

          if (!isFiniteNumber(lat) || !isFiniteNumber(lng)) {
            return;
          }

          const statusColor = getStatusColor(status);
          const markerId = "marker_" + markers.length;

          const marker = L.marker([lat, lng], {
            icon: createIcon(statusColor, getTypeIcon(type), price, type),
            draggable: true
          }).addTo(map);

          if (!editMode && marker.dragging) {
            marker.dragging.disable();
          }

          const dataItem = {
            markerId,
            marker,
            name,
            type,
            status,
            price,
            shortPrice,
            address,
            note,
            sheetGid,
            lat,
            lng
          };

          markerIndex[markerId] = dataItem;

          if (name) {
            marker.bindTooltip(escapeHtml(name), {
              direction: "top",
              offset: [0, -18],
              opacity: 0.95,
              sticky: true
            });
          }

          marker.bindPopup(createPopupHtml(dataItem));

          marker.on("dragend", function() {
            const p = marker.getLatLng();

            dataItem.lat = p.lat;
            dataItem.lng = p.lng;

            marker.setPopupContent(createPopupHtml(dataItem));
            marker.openPopup();

            // ドラッグ終了時に自動保存
            saveMarkerPosition(markerId);
          });

          markers.push(marker);
          allData.push(dataItem);

          if (isParking(type)) {
            markerGroups.parking.push(marker);
          } else {
            markerGroups.housing.push(marker);
          }
        });

        if (markers.length > 0) {
          map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
        } else {
          console.warn("表示できるピンがありません。CSVの見出し・緯度・経度を確認してください。", data.slice(0, 5));
          alert(`表示できるピンがありません。

総覧シートの見出しが H1=緯度、I1=経度 になっているか、H列・I列に数値が入っているか確認してください。

※公開CSVの更新に少し時間がかかる場合もあります。`);
        }
      })
      .catch(err => {
        console.error("CSV読み込みエラー:", err);
        alert("CSVの読み込みに失敗しました");
      });
  </script>
</body>
</html>
